[project]
name = "cogna-schemainspect"
version = "1.2.3"
authors = [{ name = "Cogna Co", email = "info@cogna.co" }]
license = "Unlicense"
readme = "README.md"
description = "Schema inspection for PostgreSQL (and possibly others). Public fork for cogna changes."
# Read from [tool.poetry.dependencies]
dynamic = ["dependencies", "requires-python"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
repository = "https://github.com/cogna-public/schemainspect"
homepage = "https://github.com/cogna-public/schemainspect"

[tool.poetry.dependencies]
python = ">=3.9,<4"
sqlalchemy = "1.4.46"
sqlbag= ">=0.1.1616028516"

[tool.poetry]
packages = [{ include = "schemainspect" }]

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-clarity = "*"
psycopg2-binary = "*"
flake8 = "*"
isort = "5.10.1"
migra = "*"
black = "22.3.0"
toml = "*"
python-dotenv = "^1.1.0"

[tool.poetry.scripts]
schemainspect = 'schemainspect:do_command'

[tool.isort]
profile = "black"
